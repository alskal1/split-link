spring:
  application:
    name: split-link
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/split_link?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

jwt:
  # 환경변수 JWT_SECRET이 있으면 그 값을 쓰고, 없으면 뒤의 '개발용 테스트 키'를 기본값으로 사용
  secret-key: ${JWT_SECRET:splitlink-jwt-secret-key-for-local-development-test-1234567890}