spring:
  application:
    name: split-link
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/split_link?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

jwt:
  secret-key: ${JWT_SECRET:splitlink-jwt-secret-key-for-local-development-test-1234567890}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:splitlink-encryption-secret-key32}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}