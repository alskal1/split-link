spring:
  application:
    name: split-link
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/split_link?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret-key: test-jwt-secret-key-for-splitlink-must-be-over-32-bytes

encryption:
  secret-key: 12345678901234567890123456789012

cors:
  allowed-origins: http://localhost:5173